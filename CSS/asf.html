<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Box Model</title>

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        line-height:1.6:
        padding: 20px;
        background-color: #f4f4f4;
      }
      /* Common box styles */
      .element {
        width: 300px;
        height: 200px;
        padding: 20px;
        border: 5px solid black;
        margin-bottom: 30px;
      }

      /* Content Box */
      .content-box {
        box-sizing: content-box;
        background-color: lightblue;
      }

      /* Border Box */
      .border-box {
        box-sizing: border-box;
        background-color: lightgreen;
      }
    </style>
  </head>

  <body>
    <h1>CSS Box Model Example</h1>

    <!-- Content Box -->
    <h2>Content-box (Default)</h2>

    <div class="content-box element">
      <p>
        This is a content-box element.<br />
        Width = 300px + padding + border
      </p>
    </div>

    <!-- Border Box -->
    <h2>Border-box</h2>

    <div class="border-box element">
      <p>
        This is a border-box element.<br />
        Width includes padding and border.
      </p>
    </div>
  </body>
</html>
