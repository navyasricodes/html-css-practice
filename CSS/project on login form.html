<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login form project_1</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #999292;
        margin: 0;
        padding: 0;
        display: flex;
        height: 100vh;
        justify-content: center;
        align-items: center;
      }
      .card {
        background-color: #fff;
        padding: 40px;
        margin: 80vh;
        width: 300px;
      }
      h2 {
        font-size: xx-large;
        color: cadetblue;
        padding: 20px;
        margin-bottom: 20px;
      }
      form {
        display: flex;
        flex-direction: column;
      }
      input {
        border-radius: 1dvh;
        margin-bottom: 20px;
        padding: 10px;
        background-color: #fff;
      }
      input:hover {
        background-color: #b62c2c;
      }
      button {
        background-color: #7eaeef;
        padding: 8px;
        margin: 5px;
        color: #fff;
      }
      button:hover {
        background-color: #6611c7;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>Login</h2>
      <form>
        <input type="email" name="" id="" placeholder="email" />
        <input type="password" name="" id="" placeholder="password" />
        <button>Login</button>
      </form>
    </div>
  </body>
</html>
