<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CBIT</title>
    <style>
      body {
        font-weight: bold;
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-content: center;
        background-image: url("CBIT-slide.jpg");
        background-size: cover;
        background-repeat: no-repeat;
        background-position: center;
      }
      .container {
        padding: 10px;
        border: 2px solid #111;
        width: 400px;
        text-align: center;
        background-color: #95dcc3;
        color: rgb(11, 11, 11);
        height: 84vh;
        margin-top: 40px;
      }
      .buttons {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;
        gap: 50px;
        margin: 10px;
        padding: 0px;
      }
      .buttons button {
        background-color: #7f60d3; /* button color */
        color: rgb(252, 251, 251); /* text color */
        padding: 15px;
        border-color: #111;
        border: 2px solid #111;
        border-radius: 10px;
        transition: background-color 1s ease-in-out;
      }
      .buttons button:hover {
        background-color: #c51515;
      }
      .image {
        display: block;
        margin: auto;
        background-color: #9a41ac;
        padding: 20px;
        border: 2px solid #111;
        border-radius: 50%;
      }
      .title {
        text-align: left;
        width: 100%;
        font-size: x-large;
      }
      .size {
        font-size: x-large;
        font-family: Arial, Helvetica, sans-serif;
      }
      .para {
        font-family: Arial, Helvetica, sans-serif;
        font-size: medium;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p class="size">CHAITHANYA BHARATHI INSTITUTE OF TECHNOLOGY</p>
      <img src="CSS/cbit logo.jpeg" class="image" srcset="" />
      <h1 class="title">CBIT College</h1>
      <p class="para">📍 Proddatur, Andhra Pradesh</p>
      <p class="para">This is the place where the innovation starts.</p>
      <p class="para">
        Top Engineering College near proddatur with modern labs and placements.
      </p>
      <div class="buttons">
        <button>Explore campus</button>
        <button>Apply now</button>
      </div>
    </div>
  </body>
</html>
