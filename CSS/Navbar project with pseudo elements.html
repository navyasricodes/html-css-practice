<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar</title>
    <style>
      body {
        background-color: #a4edf4;
        margin: 0px;
        padding: 12px;
        color: rgb(21, 21, 21);
        font-family: Arial, Helvetica, sans-serif;
      }
      /*nav1*/
      .nav-container {
        color: rgb(3, 88, 13);
        font-weight: 20px;
        padding: 4px;
        margin: 5px;
      }
      .nav1 {
        background-color: none;
        padding: 0px;
        margin: 0px;
      }
      .nav1 ul {
        display: flex;
        justify-content: space-around;
        padding: 1%;
        margin: 0px;
        background-color: #fff;
      }
      .nav1 li {
        background-color: #0f1011;
        color: black;
        list-style-type: none;
      }
      .nav1 a {
        color: rgb(66, 3, 3);
        background-color: #3fe950;
        align-self: hover;
        position: relative;
      }
      .login-btn {
        background-color: #e5e4e9;
        padding: 0px;
        width: 100px;
        color: #030208;
        border-color: #2941c8;
        border-style: dashed;
        transition: background-color 1s ease-in-out;
      }
      .login-btn:hover {
        background-color: #2941c8;
        cursor: pointer;
      }
      .nav1 a:hover {
        background-color: #98e9a1;
      }
      .nav1 a::after {
        content: "sri";
        position: absolute;
        height: 10px;
        width: 100%;
        padding: 0;
        left: 0;
        bottom: 0;
        margin: 0;
        transition: transform 0.4s;
        transform: scaleY(0);
      }
      .nav1 a:hover::after {
        color: rgb(222, 25, 25);
        transform: scaleY(1);
      }
      /*nav2*/
      .nav2 {
        background-color: #df7bcb;
        width: 160px;
        color: #3fe950;
        display: block;
      }
      .nav2 ul {
        list-style-type: none;
        padding: 0px;
        margin: 0px;
        border: 2px solid #2941c8;
      }
      .nav2 li {
        margin: 14px;
      }
      .nav2 a:hover {
        background-color: #de0a78;
      }
      .nav2 .login-btn {
        background-color: #ecaf05;
        color: #0f1011;
        border: 1px solid #db2713;
        width: 100px;
        transition: background-color 1s ease-in-out;
      }
      .nav2 .login-btn:hover {
        background-color: #ebeb8e;
      }
      /*nav3*/
      .nav3 {
        background-color: #46adad;
        padding: 2px;
        margin: 0px;
      }
      .nav3 ul {
        display: flex;
        list-style-type: none;
        justify-content: space-around;
      }
      .nav3 a {
        text-decoration: none;
        display: flex;
        color: #141516;
        background-color: #677805;
        transform: scaleX(1);
        padding: 0%;
        margin: 0%;
      }
      .nav3 .dropdown-content {
        display: none;
        color: #2941c8;
      }
      .nav3 .dropdown:hover .dropdown-content {
        display: block;
        position: absolute;
        background-color: #7fdada;
        width: 120px;
        padding: 12px;
        margin: 13px;
      }
      .nav3 a:hover {
        background-color: #cbec85;
      }
    </style>
  </head>
  <body>
    <div class="nav-container">
      <h1>variation 1: Horizantal with underline effect</h1>
      <nav class="nav1">
        <ul>
          <li><a href="Home">Home</a></li>
          <li><a href="about">about</a></li>
          <li><a href="products">products</a></li>
          <li><button class="login-btn">login</button></li>
        </ul>
      </nav>
    </div>
    <article class="nav-container">
      <h1>variation 2: vertical with hover effect</h1>
      <nav class="nav2">
        <ul>
          <li><a href="Home">Home</a></li>
          <li><a href="about">about</a></li>
          <li><a href="products">products</a></li>
          <li><button class="login-btn">login</button></li>
        </ul>
      </nav>
    </article>
    <div class="nav-container">
      <h1>variation 3: Horizantal with dropdown</h1>
      <nav class="nav3">
        <ul>
          <li><a href="Home">Home</a></li>
          <li class="dropdown">
            <a href="about">about</a>
            <div class="dropdown-content">
              <a href="our story">our story</a>
              <a href="team">team</a>
              <a href="contact">contact</a>
            </div>
          </li>
          <li><a href="products">products</a></li>
          <li><button class="login-btn">login</button></li>
        </ul>
      </nav>
    </div>
  </body>
</html>
