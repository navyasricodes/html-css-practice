<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flexbox</title>
    <style>
      body {
        padding: 20px;
        margin: 0;
        background-color: antiquewhite;
        list-height: 1.6;
        font-family: Arial, Helvetica, sans-serif;
      }
      h2 {
        margin: 0 0 8px 0;
        font-size: 22px;
      }
      .container {
        padding: 1px;
        margin: 1px;
        background-color: #f7f2f2;
        margin-bottom: 30px;
        width: 29rem;
        border: 2px solid #050505;
        line-height: 4;
      }
      .flex-container {
        display: flex;
        gap: 5px;
        height: 300px;

        margin: 0;
        padding: 0px;
        margin-bottom: 10px;
        justify-content: flex-start;
      }
      .circle {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        color: rgb(17, 17, 17);
        font-size: 18px;
        font-weight: bold;
        margin: 5px;
        padding: 5px;
      }
      .pastel-1 {
        background-color: #81d119;
      }
      .pastel-2 {
        background-color: #d36f11;
      }
      .pastel-3 {
        background-color: #19bd16;
      }
      .pastel-4 {
        background-color: #05798e;
      }
      .pastel-5 {
        background-color: #c50889;
      }
      .pastel-6 {
        background-color: #ceb70d;
      }
      .pastel-7 {
        background-color: #a20505;
      }
      .pastel-8 {
        background-color: #7a08cc;
      }
      .pastel-9 {
        background-color: #220453;
      }
      .pastel-10 {
        background-color: #057f50;
      }
    </style>
  </head>
  <body>
    <h1>flexbox master class</h1>
    <h1>Demo</h1>
    <div class="container">
      <h2>1.default flex(row)</h2>
      <div class="flex-container" style="flex-direction: row">
        <div class="circle pastel-1">1</div>
        <div class="circle pastel-2">2</div>
        <div class="circle pastel-3">3</div>
        <div class="circle pastel-4">4</div>
        <div class="circle pastel-5">5</div>
      </div>
    </div>
    <div class="container">
      <h2>2.flexbox: column</h2>
      <div class="flex-container" style="flex-direction: column">
        <div class="circle pastel-1">1</div>
        <div class="circle pastel-2">2</div>
        <div class="circle pastel-3">3</div>
        <div class="circle pastel-4">4</div>
        <div class="circle pastel-5">5</div>
      </div>
    </div>
    <div class="container">
      <h2>3.justify content: space-between</h2>
      <div class="flex-container" style="justify-content: end">
        <div class="circle pastel-1">1</div>
        <div class="circle pastel-2">2</div>
        <div class="circle pastel-3">3</div>
        <div class="circle pastel-4">4</div>
        <div class="circle pastel-5">5</div>
      </div>
    </div>
    <div class="container">
      <h2>4.Align items: center</h2>
      <div class="flex-container" style="align-items: center">
        <div class="circle pastel-1">1</div>
        <div class="circle pastel-2">2</div>
        <div class="circle pastel-3">3</div>
        <div class="circle pastel-4">4</div>
        <div class="circle pastel-5">5</div>
      </div>
    </div>
    <div class="container">
      <h2>5.Flex wrap: wrap</h2>
      <div class="flex-container" style="flex-wrap: wrap; height: auto">
        <div class="circle pastel-1">1</div>
        <div class="circle pastel-2">2</div>
        <div class="circle pastel-3">3</div>
        <div class="circle pastel-4">4</div>
        <div class="circle pastel-5">5</div>
        <div class="circle pastel-6">6</div>
        <div class="circle pastel-7">7</div>
        <div class="circle pastel-8">8</div>
        <div class="circle pastel-9">9</div>
        <div class="circle pastel-10">10</div>
      </div>
    </div>
    <div class="container">
      <h2>6.order property</h2>
      <div class="flex-container">
        <div class="circle pastel-1" style="order: 3">1</div>
        <div class="circle pastel-2" style="order: 5">2</div>
        <div class="circle pastel-3" style="order: 1">3</div>
        <div class="circle pastel-4" style="order: 4">4</div>
        <div class="circle pastel-5" style="order: 2">5</div>
      </div>
    </div>
    <div class="container">
      <h2>7.Flex grow</h2>
      <div class="flex-container">
        <div class="circle pastel-1" style="flex-grow: 2">1</div>
        <div class="circle pastel-2" style="flex-grow: 3">2</div>
        <div class="circle pastel-3" style="flex-grow: 4">3</div>
        <div class="circle pastel-4" style="flex-grow: 1">4</div>
        <div class="circle pastel-5" style="flex-grow: 6">5</div>
      </div>
    </div>
    <div class="container">
      <h2>8.Align self</h2>
      <div class="flex-container">
        <div class="circle pastel-1" style="align-self: start">1</div>
        <div class="circle pastel-2" style="align-self: center">2</div>
        <div class="circle pastel-3" style="align-self: end">3</div>
        <div class="circle pastel-4" style="align-self: stretch; height: auto">
          4
        </div>
        <div class="circle pastel-5" style="align-self:">5</div>
      </div>
    </div>
  </body>
</html>
