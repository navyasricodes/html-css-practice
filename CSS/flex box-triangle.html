<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox Triangle</title>
    <style>
      body {
        padding: 20px;
        margin: 0;
        background-color: antiquewhite;
        font-family: Arial, Helvetica, sans-serif;
      }
      .container {
        width: 500px;
        height: 300px;
        border: 2px solid black;
        background-color: rgb(240, 235, 235);
        margin-bottom: 30px;
        padding: 10px;
      }
      h2 {
        margin-bottom: 20px;
      }
      .flex-container {
        display: flex;
        gap: 20px;
      }
      .triangle {
        width: 0;
        height: 0;
        border-left: 40px solid transparent;
        border-right: 40px solid transparent;
        border-bottom: 70px solid green;
        position: relative;
      }
      .triangle span {
        position: absolute;

        top: 35px;
        left: 50%;

        transform: translateX(-50%);

        color: black;
        font-size: 20px;
        font-weight: bold;
      }
      .container1 {
        height: 500px;
      }
    </style>
  </head>

  <body>
    <h1>Flexbox Triangle Demo</h1>

    <!-- Row -->
    <div class="container">
      <h2>1. Flex Direction Row</h2>

      <div class="flex-container" style="flex-direction: row">
        <div class="triangle"><span>1</span></div>

        <div class="triangle"><span>2</span></div>

        <div class="triangle"><span>3</span></div>

        <div class="triangle"><span>4</span></div>

        <div class="triangle"><span>5</span></div>
      </div>
    </div>

    <!-- Column -->
    <div class="container container1">
      <h2>2. Flex Direction Column</h2>

      <div class="flex-container" style="flex-direction: column">
        <div class="triangle"><span>1</span></div>
        <div class="triangle"><span>2</span></div>
        <div class="triangle"><span>3</span></div>
        <div class="triangle"><span>4</span></div>
        <div class="triangle"><span>5</span></div>
      </div>
    </div>
  </body>
</html>
