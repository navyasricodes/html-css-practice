<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>care taker</title>
    <style>
      body {
        padding: 40px;
        margin: 30px;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(100deg, #280b81, #d817ab);
        justify-items: center;
        height: 100%;
        align-items: center;
        width: 100%;
      }

      .container {
        display: block;
        color: rgb(97, 2, 61);
      }
      .content {
        text-align: center;
        justify-content: center;
        align-content: center;
        background-color: rgba(131, 222, 225, 0.9);
        padding: 2rem;
        width: 50%;
        display: block;
      }
      .logo {
        width: 50%;
        padding: 0px;
        margin: 2px;
      }
      .heading {
        color: black;
        text-align: left;
        padding: 10px;
        margin: 5px;
      }
      p {
        padding: 12px;
        margin: 10px;
        font-weight: 300;
      }
      form {
        color: #060606;
        flex-direction: column;
        display: flex;
      }
      input {
        background-color: #b1c771;
        border: 2px solid black;
        border-radius: 4px;
        border-color: #d817ab;
        color: #fff;
        padding: 10px;
      }
      label {
        text-align: left;
      }
      input:hover {
        background-color: #85ad0e;
      }
      button {
        color: #060606;
        background-color: #5574dc;
        padding: 10px;
        margin: 8px;
        width: 16rem;
        text-align: center;
        margin-top: 5%;
        border-color: #280b81;
        align-self: center;
      }
      button:hover {
        background-color: #0d2ac9;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="content">
        <img
          src="CSS/comming soon.html/kids-logo.jpg"
          class="logo"
          width="400px"
          alt=""
          srcset=""
        />
        <h1 class="heading">coming soon</h1>
        <p>
          The purpose of establishing this caretaker centre is to provide care
          for children while their parents are at work.
        </p>
        <form>
          <label for="child">child:</label>
          <input type="text" placeholder="first name" />
          <label for="parents">parents:</label>
          <input type="text" placeholder="second name" />
          <button type="submit">submit</button>
        </form>
      </div>
    </div>
  </body>
</html>
